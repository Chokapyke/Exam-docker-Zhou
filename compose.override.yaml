# MODE DEV : chargé automatiquement par `docker compose up`
services:
  backend:
    image: ${IMAGE_PREFIX:-mon-projet-docker}/backend:dev
    build:
      target: development
    volumes:
      - ./backend/src:/app/src            # hot reload (node --watch)

  frontend:
    image: ${IMAGE_PREFIX:-mon-projet-docker}/frontend:dev
    build:
      target: development
    environment:
      API_URL: http://backend:3000
      VITE_POLLING: "true"                # utile sur Docker Desktop (Mac/Windows)
    ports:
      - "${HTTP_PORT:-8080}:5173"         # point d'entrée unique (Vite)
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.js:/app/vite.config.js
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
